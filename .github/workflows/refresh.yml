name: Refresh proxy pool
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/refresh.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: proxy-pool-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Collect and check
        run: python src/proxy_pool.py --output public/proxies.json
      - name: Publish JSON to data branch
        shell: bash
        run: |
          set -euo pipefail
          cp public/proxies.json "$RUNNER_TEMP/proxies.json"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/proxies.json" proxies.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add proxies.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update checked proxy pool'
            git push origin HEAD:data
          fi
